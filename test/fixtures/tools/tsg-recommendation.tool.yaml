# Fixture: tsg-recommendation tool with the REAL consumer contract.
# action-level vscode_tool provides the registered name (action-level).
# suggested_tsg_id and suggested_tsg_title are optional: absent in the
# "no-suggestion" outcome, present in the "suggested" outcome.
name: tsg-recommendation
transport:
  mode: vscode-mcp
actions:
  - name: recommend
    vscode_tool: tsg-recommendation-recommend
    outputs:
      recommendation_status:
        type: string
        required: true
      suggested_tsg_id:
        type: string
        required: false
      suggested_tsg_title:
        type: string
        required: false
