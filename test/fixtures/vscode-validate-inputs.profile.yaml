# Minimal unattended runtime profile for gert dry-run validation from the
# VS Code extension host (and tests invoking gert from a non-TTY subprocess).
#
# This profile satisfies the Phase 1B fail-fast gate
# (runWithMode: runtimeProfile == nil && !isInteractiveTTY()) without
# requiring the user to author their own profile. It declares:
#
#   context: vscode-operator — process is running inside the VS Code
#     extension host, not on a CI runner or headless server.
#
#   attendance: unattended — the extension calls gert dry-run programmatically
#     (non-TTY stdin); no human can be prompted for approval. In dry-run mode
#     no tools actually execute, so the approval policy is inert.
#
# This file is NOT a user-visible profile. It is an extension implementation
# detail consumed only by validateInputs (gert dry-run) and the corresponding
# regression tests. It must NOT be included in the published VSIX.
apiVersion: runtime-profile/v1
id: vscode-validate-inputs
context: vscode-operator
attendance: unattended
