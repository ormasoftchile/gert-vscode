name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-package:
    name: Compile, Test & Package Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile (tsc)
        run: npm run compile

      - name: Unit tests
        # Runs the hermetic unit suite — no external binary required.
        # The suite includes test/repoBoundary.test.js which enforces:
        #   - no sibling-repo references or cross-repo path traversals
        #   - no process.env.GERT_BIN in unit test files
        #   - no skip: in test declarations (rule4)
        #   - every test/**/*.test.js is reachable by a configured runner (rule5)
        #   - every node --test npm script is invoked by a CI workflow (rule6)
        run: npm test

      - name: Package (vsce)
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: gert-preview-vsix
          path: gert-preview.vsix
          if-no-files-found: error

  cross-repository-host-action-contract:
    name: Cross-repository host-action contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ormasoftchile/gert
          path: gert-core

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical wire compatibility
        run: npm run test:cross-repo
        env:
          GERT_CORE_ROOT: ${{ github.workspace }}/gert-core

  # Integration tests (requires a real gert binary) are not currently wired.
  # There are no integration test files today — test:integration is not a
  # defined script precisely because rule6 would fail it if it were unwired.
  #
  # CE-S-01/CE-V-01 was deleted: pure CLI acceptance probe, no extension
  # code in the loop, cannot be made hermetic.  Contract guarded by gert's
  # own test suite.  See .squad/decisions/inbox/ken-skip-defect.md.
  #
  # To add a genuine integration test (all three steps are required together;
  # failing any one trips a repoBoundary rule):
  #   1. Place the file under test/integration/.
  #      → rule5 fails until step 2 is complete.
  #   2. Add "test:integration": "node --test test/integration/**/*.test.js"
  #      to package.json scripts.
  #      → rule6 fails until step 3 is complete.
  #   3. Add an integration-tests job below that invokes npm run test:integration.
  #      The job MUST fail (never silently pass) when no binary is present —
  #      node --test with no matching files exits 0; add a check or ensure
  #      GERT_BIN is always set (e.g., via a "Download gert release" step).

